<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة معلومات المستخدم - SNDL</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-top: 8px solid #8cb43f; }
        .header-image { text-align: center; margin-bottom: 20px; }
        .header-image img { max-width: 100%; height: auto; border-radius: 5px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .section-title { background: #f9f9f9; padding: 10px; border-right: 5px solid #8cb43f; margin: 20px 0 15px; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #8cb43f; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #6d8d31; }
        .required { color: red; }
        #success-msg { display: none; background-color: #d4edda; color: #155724; padding: 15px; border-radius: 5px; text-align: center; margin-bottom: 20px; font-weight: bold; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-image">
        <img src="21.png" alt="جامعة تيبازة - المكتبة المركزية">
    </div>

    <h2>استمارة معلومات المستخدم</h2>

    <!-- رسالة النجاح المخصصة -->
    <div id="success-msg">
        تم إرسال طلبك بنجاح!<br>
        سيتم إرسال (Identifiant) و (Mot de passe) الخاص بحسابك SNDL إلى بريدك الإلكتروني قريباً.
    </div>

    <form id="sindlForm">
        
        <div class="section-title">بيانات الحساب</div>

        <div class="form-group">
            <label>اسم المستخدم (Identifiant) <span class="required">*</span></label>
            <input type="text" name="Identifiant" placeholder="مثال: user_2026" required>
        </div>

        <div class="form-group">
            <label>اللقب (Nom) <span class="required">*</span></label>
            <input type="text" name="Nom" required>
        </div>

        <div class="form-group">
            <label>الاسم (Prénom) <span class="required">*</span></label>
            <input type="text" name="Prenom" required>
        </div>

        <div class="form-group">
            <label>البريد الإلكتروني الشخصي <span class="required">*</span></label>
            <input type="email" name="Email" placeholder="example@gmail.com" required>
        </div>

        <div class="form-group">
            <label>(Rôle) الرتبة <span class="required">*</span></label>
            <select name="Role" required>
                <option value="" disabled selected>... اختر الرتبة</option>
                <option value="3eme année licence">3eme année licence</option>
                <option value="Master II">Master II</option>
                <option value="5 ème année Ingenieur">5 ème année Ingenieur</option>
                <option value="5 ème année et plus sciences médicales">5 ème année et plus sciences médicales</option>
                <option value="Post-graduant Magister">Post-graduant Magister</option>
                <option value="Post-graduant Doctorant">Post-graduant Doctorant</option>
                <option value="Enseignant">Enseignant</option>
                <option value="Sciences Médicales">Sciences Médicales</option>
            </select>
        </div>

        <div class="section-title">بيانات التحقق</div>

        <div class="form-group">
            <label>رقم بطاقة الطالب <span class="required">*</span></label>
            <input type="text" name="StudentCard" required>
        </div>

        <div class="form-group">
            <label>الكلية <span class="required">*</span></label>
            <select name="Faculty" required>
                <option value="" disabled selected>... اختر الكلية</option>
                <option value="كلية العلوم الاقتصادية والتجارية وعلوم التسيير">كلية العلوم الاقتصادية والتجارية وعلوم التسيير</option>
                <option value="كلية اللغة والادب العربي">كلية اللغة والادب العربي</option>
                <option value="كلية العلوم">كلية العلوم</option>
                <option value="كلية العلوم الطبيعية والحياة">كلية العلوم الطبيعية والحياة</option>
                <option value="ملحقة الطب">ملحقة الطب</option>
                <option value="المدرسة العليا للاساتذة">المدرسة العليا للاساتذة</option>
                <option value="كلية العلوم الانسانية والاجتماعية">كلية العلوم الانسانية والاجتماعية</option>
                <option value="كلية الحقوق والعلوم السياسية">كلية الحقوق والعلوم السياسية</option>
            </select>
        </div>

        <div class="form-group">
            <label>التخصص (Spécialité) <span class="required">*</span></label>
            <input type="text" name="Specialty" placeholder="اكتب تخصصك هنا..." required>
        </div>

        <button type="submit" id="submitBtn">إرسال طلب التسجيل</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzDONez0M0oYT6HTnXBpz7CxnIgJUYtfLgX_zHqiNWuAAZr3u8kFbCshZol9pb1Ggdh/exec';
    const form = document.getElementById('sindlForm');
    const successMsg = document.getElementById('success-msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'جاري الإرسال...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(response => {
                successMsg.style.display = 'block';
                form.reset();
                submitBtn.disabled = false;
                submitBtn.textContent = 'إرسال طلب التسجيل';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            })
            .catch(error => {
                alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'إرسال طلب التسجيل';
            });
    });
</script>

</body>
</html>
