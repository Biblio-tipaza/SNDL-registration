<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة معلومات المستخدم - SNDL</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #2b6a8a 0%, #153b4f 100%); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }
        .container { 
            max-width: 650px; 
            margin: auto; 
            background: linear-gradient(135deg, #f7e9cc 0%, #e8c99b 100%); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            border: 3px solid #d4af37; 
            border-top: 12px solid #8cb43f; 
        }
        .header-image { 
            text-align: center; 
            margin-bottom: 20px; 
        }
        .header-image img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 6px; 
            border: 2px solid #d4af37;
        }
        
        /* إطار العنوان بلون مطابق لزر الإرسال وبخط واضح */
        .page-title-box {
            background: #8cb43f;
            border: 2px solid #759a33;
            border-radius: 8px;
            text-align: center;
            padding: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        h2 { 
            color: #ffffff; 
            margin: 0; 
            font-size: 28px; 
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .section-title { 
            background: #ffffff; 
            padding: 12px; 
            border-right: 6px solid #8cb43f; 
            margin: 25px 0 15px; 
            font-weight: bold; 
            font-size: 18px;
            color: #153b4f;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        .form-group { 
            margin-bottom: 18px; 
        }
        label { 
            display: block; 
            margin-bottom: 7px; 
            font-weight: bold; 
            color: #222; 
            font-size: 16px;
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #b89762; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px;
            background-color: #fffcf7;
        }
        input:focus, select:focus {
            border-color: #8cb43f;
            outline: none;
            box-shadow: 0 0 8px rgba(140, 180, 63, 0.4);
            background-color: #ffffff;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #8cb43f; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        button:hover { 
            background-color: #6d8d31; 
        }
        .required { 
            color: #c0392b; 
        }

        /* تنسيق نافذة الرسالة المنبثقة (Modal) */
        #success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-top: 8px solid #8cb43f;
            animation: modalPop 0.3s ease-in-out;
        }
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-content h3 {
            color: #155724;
            margin-top: 0;
            font-size: 22px;
        }
        .modal-content p {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-btn {
            background-color: #8cb43f;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-btn:hover {
            background-color: #6d8d31;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- الترويسة العليا -->
    <div class="header-image">
        <img src="header-new1.png" alt="جامعة تيبازة - المكتبة المركزية">
    </div>

    <!-- العنوان بلون زر الإرسال -->
    <div class="page-title-box">
        <h2>استمارة معلومات المستخدم</h2>
    </div>

    <form id="sindlForm">
        
        <div class="section-title">بيانات الحساب</div>

        <div class="form-group">
            <label>اسم المستخدم (Identifiant) <span class="required">*</span></label>
            <input type="text" name="Identifiant" placeholder="مثال: user_2026" required>
        </div>

        <div class="form-group">
            <label>اللقب (Nom) <span class="required">*</span></label>
            <input type="text" name="Nom" required>
        </div>

        <div class="form-group">
            <label>الاسم (Prénom) <span class="required">*</span></label>
            <input type="text" name="Prenom" required>
        </div>

        <div class="form-group">
            <label>البريد الإلكتروني الشخصي <span class="required">*</span></label>
            <input type="email" name="Email" placeholder="example@gmail.com" required>
        </div>

        <div class="form-group">
            <label>(Rôle) الرتبة <span class="required">*</span></label>
            <select name="Role" required>
                <option value="" disabled selected>... اختر الرتبة</option>
                <option value="3eme année licence">3eme année licence</option>
                <option value="Master II">Master II</option>
                <option value="5 ème année Ingenieur">5 ème année Ingenieur</option>
                <option value="5 ème année et plus sciences médicales">5 ème année et plus sciences médicales</option>
                <option value="Post-graduant Magister">Post-graduant Magister</option>
                <option value="Post-graduant Doctorant">Post-graduant Doctorant</option>
                <option value="Enseignant">Enseignant</option>
                <option value="Sciences Médicales">Sciences Médicales</option>
            </select>
        </div>

        <div class="section-title">بيانات التحقق</div>

        <div class="form-group">
            <label>رقم بطاقة الطالب <span class="required">*</span></label>
            <input type="text" name="StudentCard" required>
            <span style="font-size: 12px; color: #555;">(أو رقم التعريف الوظيفي بالنسبة للأساتذة)</span>
        </div>

        <div class="form-group">
            <label>الكلية <span class="required">*</span></label>
            <select name="Faculty" required>
                <option value="" disabled selected>... اختر الكلية</option>
                <option value="كلية العلوم الاقتصادية والتجارية وعلوم التسيير">كلية العلوم الاقتصادية والتجارية وعلوم التسيير</option>
                <option value="كلية اللغة والادب العربي">كلية اللغة والادب العربي</option>
                <option value="كلية العلوم">كلية العلوم</option>
                <option value="كلية العلوم الطبيعية والحياة">كلية العلوم الطبيعية والحياة</option>
                <option value="ملحقة الطب">ملحقة الطب</option>
                <option value="المدرسة العليا للاساتذة">المدرسة العليا للاساتذة</option>
                <option value="كلية العلوم الانسانية والاجتماعية">كلية العلوم الانسانية والاجتماعية</option>
                <option value="كلية الحقوق والعلوم السياسية">كلية الحقوق والعلوم السياسية</option>
            </select>
        </div>

        <div class="form-group">
            <label>التخصص (Spécialité) <span class="required">*</span></label>
            <input type="text" name="Specialty" placeholder="اكتب تخصصك هنا..." required>
        </div>

        <button type="submit" id="submitBtn">إرسال طلب التسجيل</button>
    </form>
</div>

<!-- النافذة المنبثقة لرسالة النجاح (Modal) -->
<div id="success-modal">
    <div class="modal-content">
        <h3>تم إرسال طلبك بنجاح!</h3>
        <p>سيتم إرسال (Identifiant) و (Mot de passe) الخاص بحسابك SNDL إلى بريدك الإلكتروني قريباً.</p>
        <button class="modal-btn" onclick="closeModal()">موافق</button>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzDONez0M0oYT6HTnXBpz7CxnIgJUYtfLgX_zHqiNWuAAZr3u8kFbCshZol9pb1Ggdh/exec';
    const form = document.getElementById('sindlForm');
    const successModal = document.getElementById('success-modal');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'جاري الإرسال...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(response => {
                successModal.style.display = 'flex'; // إظهار النافذة المنبثقة
                form.reset();
                submitBtn.disabled = false;
                submitBtn.textContent = 'إرسال طلب التسجيل';
            })
            .catch(error => {
                alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'إرسال طلب التسجيل';
            });
    });

    // دالة لإغلاق النافذة المنبثقة عند الضغط على موافق
    function closeModal() {
        successModal.style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
